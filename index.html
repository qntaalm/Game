<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة المتاهة — 6 مراحل</title>
<style>
:root{--bg:#050816;--panel:#0b1230;--blue:#2d7dff;--yellow:#ffd51c;--text:#f5f7ff;--muted:#aab5d6;--danger:#ff3b4f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#101b42,#050816 60%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{width:min(1200px,96vw);margin:18px auto;display:grid;grid-template-columns:250px 1fr;gap:16px;direction:ltr}
.panel,.gamebox{background:rgba(8,14,39,.92);border:1px solid #263b78;border-radius:18px;box-shadow:0 15px 50px #0008}
.panel{padding:18px;direction:rtl}.logo{font-weight:900;font-size:30px;letter-spacing:2px;color:var(--yellow);text-align:center;margin-bottom:12px}
.stat{border:1px solid #31457e;border-radius:12px;padding:12px;text-align:center;margin:10px 0}.big{font-size:34px;font-weight:900}.easy{color:#32e875}.med{color:#4cb5ff}.hard{color:#ff5a68}
.stages{display:grid;gap:7px;margin-top:8px}.stage{width:100%;padding:10px;border:1px solid #2c467e;border-radius:10px;background:#0d1738;color:white;cursor:pointer;text-align:right}.stage:hover{filter:brightness(1.2)}.stage.active{border-color:var(--yellow);box-shadow:0 0 12px #ffd51c44}.stage.locked{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:var(--muted)}
button{font:inherit}.restart{width:100%;margin-top:14px;padding:11px;border-radius:11px;border:1px solid var(--blue);background:#0d2c6d;color:white;cursor:pointer}
.gamebox{padding:14px;direction:rtl}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.title{font-size:20px;font-weight:800}.hint{color:var(--muted);font-size:13px}
#game{display:block;width:100%;max-width:900px;margin:auto;background:#000;border:3px solid #1d6dff;border-radius:14px;image-rendering:pixelated}
.controls{display:grid;grid-template-columns:repeat(3,65px);grid-template-rows:repeat(2,55px);gap:7px;justify-content:center;margin:13px auto 5px;direction:ltr}.controls button{border:1px solid #40527e;background:#111a38;color:white;border-radius:12px;font-size:25px;cursor:pointer}.controls button:active{transform:scale(.95);background:#1c326d}
.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
.notice{text-align:center;border:1px solid #2e4273;border-radius:10px;padding:10px;color:#dce4ff;margin-top:10px}.kbd{padding:2px 6px;border:1px solid #52638e;border-radius:5px;background:#101936}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal{width:min(520px,92vw);background:#0b1230;border:2px solid #3456a8;border-radius:18px;padding:25px;text-align:center;box-shadow:0 20px 80px #000}.modal h2{margin-top:0}.modal button{padding:10px 22px;border-radius:10px;border:0;background:var(--blue);color:white;cursor:pointer}

/* تعديل تنسيق الفيديو وإضافة أنيميشن التكبير */
#scareVideo {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  max-width: 80vw;
  max-height: 80vh;
  border: 3px solid var(--blue);
  border-radius: 16px;
  box-shadow: 0 0 30px #000;
  z-index: 50;
}

#scareVideo.active {
  display: block;
  animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
}

@keyframes zoomIn {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

@media(max-width:800px){.wrap{grid-template-columns:1fr}.panel{order:2}.gamebox{order:1}.logo{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="panel">
    <div class="logo">PAC • MAZE</div>
    <div class="stat"><div class="small">المستوى الحالي</div><div class="big" id="levelText">1 / 6</div><div id="difficulty" class="easy">مستوى الصعوبة: سهل</div></div>
    <div style="font-weight:800;margin-top:14px">اختر المرحلة</div>
    <div class="stages" id="stages"></div>
    <div class="stat">
      <div class="row"><span>🟡 الكوينز</span><b id="coinText">0 / 0</b></div>
      <hr style="border:0;border-top:1px solid #26375f">
      <div class="row"><span>❤️ المحاولات</span><b id="lives">3</b></div>
    </div>
    <button class="restart" id="restart">↻ إعادة المرحلة</button>
    <p class="small" style="line-height:1.6">ابدأ من المرحلة 1. كل مرحلة تُفتح فقط بعد إنهاء المرحلة التي قبلها.</p>
  </aside>

  <main class="gamebox">
    <div class="topbar">
      <div class="title" id="stageTitle">المرحلة 1</div>
      <div class="hint">التحكم بالأسهم أو W A S D</div>
    </div>
    <canvas id="game" width="900" height="600"></canvas>
    <div class="controls" aria-label="أزرار التحكم">
      <button class="up" data-dir="up">↑</button>
      <button class="left" data-dir="left">←</button>
      <button class="down" data-dir="down">↓</button>
      <button class="right" data-dir="right">→</button>
    </div>
    <div class="notice" id="notice">اجمع كل الكوينز للفوز بالمرحلة!</div>
  </main>
</div>

<div class="overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">انتهت اللعبة</h2>
    <p id="modalText"></p>
    <button id="modalBtn">حسناً</button>
  </div>
</div>

<video id="scareVideo" preload="auto" playsinline controlslist="nodownload">
  <source id="scareSource" src="scare.mp4" type="video/mp4">
</video>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const COLS=30,ROWS=20,CW=canvas.width/COLS,CH=canvas.height/ROWS;

// محرك الصوت الداخلي (Web Audio API)
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// صوت جمع الكوين
function playCoinSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

// صوت الاصطدام
function playHitSound() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

// صوت الفوز
function playWinSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(523.25, now);
  osc.frequency.setValueAtTime(659.25, now + 0.1);
  osc.frequency.setValueAtTime(783.99, now + 0.2);
  osc.frequency.setValueAtTime(1046.50, now + 0.3);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.5);
}

const levels=[
 {
   difficulty:'سهل',
   walls:[
    [0,0,30,1],[0,19,30,1],[0,0,1,20],[29,0,1,20],
    [2,2,4,3],[7,2,5,3],[13,1,4,4],[18,2,5,3],[24,2,4,3],
    [2,6,4,2],[7,6,2,8],[10,6,10,2],[21,6,2,8],[24,6,4,2],
    [10,9,2,5],[18,9,2,5],[12,11,6,2],
    [2,15,8,2],[12,15,6,3],[20,15,8,2]
   ],
   clusters:[
    {startX: 1, startY: 1, endX: 28, endY: 1},
    {startX: 1, startY: 18, endX: 28, endY: 18},
    {startX: 14, startY: 5, endX: 15, endY: 5}
   ]
 },
 {
   difficulty:'سهل',
   walls:[
    [0,0,30,1],[0,19,30,1],[0,0,1,20],[29,0,1,20],
    [2,2,6,2],[9,2,12,2],[22,2,6,2],
    [2,5,2,9],[5,5,3,5],[9,5,2,6],[19,5,2,6],[22,5,3,5],[26,5,2,9],
    [12,5,6,2],[14,7,2,5],[12,13,6,2],
    [2,15,6,3],[9,15,12,2],[22,15,6,3]
   ],
   clusters:[
    {startX: 1, startY: 1, endX: 1, endY: 18},
    {startX: 28, startY: 1, endX: 28, endY: 18},
    {startX: 10, startY: 18, endX: 19, endY: 18}
   ]
 },
 {
   difficulty:'متوسط',
   walls:[
    [0,0,30,1],[0,19,30,1],[0,0,1,20],[29,0,1,20],
    [2,2,5,2],[8,2,4,4],[13,2,4,2],[18,2,4,4],[23,2,5,2],
    [2,5,5,2],[13,5,4,4],[23,5,5,2],
    [2,8,3,4],[6,8,2,6],[9,10,5,2],[16,10,5,2],[22,8,2,6],[25,8,3,4],
    [9,13,2,4],[19,13,2,4],[12,15,6,2],
    [2,16,6,2],[22,16,6,2]
   ],
   clusters:[
    {startX: 1, startY: 1, endX: 28, endY: 1},
    {startX: 1, startY: 18, endX: 28, endY: 18},
    {startX: 14, startY: 8, endX: 15, endY: 8}
   ]
 },
 {
   difficulty:'متوسط',
   walls:[
    [0,0,30,1],[0,19,30,1],[0,0,1,20],[29,0,1,20],
    [2,2,8,2],[11,2,8,2],[20,2,8,2],
    [2,5,2,8],[5,5,5,2],[11,5,8,2],[20,5,5,2],[26,5,2,8],
    [5,8,2,6],[23,8,2,6],[8,9,4,2],[18,9,4,2],
    [11,11,8,2],[11,14,8,2],
    [2,15,7,3],[21,15,7,3]
   ],
   clusters:[
    {startX: 1, startY: 1, endX: 28, endY: 1},
    {startX: 14, startY: 8, endX: 15, endY: 8},
    {startX: 1, startY: 18, endX: 28, endY: 18}
   ]
 },
 {
   difficulty:'صعب',
   walls:[
    [0,0,30,1],[0,19,30,1],[0,0,1,20],[29,0,1,20],
    [2,2,3,4],[6,2,5,2],[12,2,6,2],[19,2,5,2],[25,2,3,4],
    [6,5,2,5],[9,5,3,2],[18,5,3,2],[22,5,2,5],
    [2,7,3,5],[13,5,4,5],[25,7,3,5],
    [6,11,5,2],[19,11,5,2],[11,11,2,5],[17,11,2,5],
    [2,13,3,4],[6,14,4,2],[20,14,4,2],[25,13,3,4],
    [11,17,8,1]
   ],
   clusters:[
    {startX: 1, startY: 1, endX: 1, endY: 18},
    {startX: 28, startY: 1, endX: 28, endY: 18},
    {startX: 12, startY: 18, endX: 17, endY: 18}
   ]
 }
];

let level=0,lives=3,player,ghosts,coins,started=false,scareShown=false,last=0,dir={x:0,y:0},nextDir={x:0,y:0};
let unlocked=1;
function key(x,y){return x+','+y}
function rectsForWalls(){return levels[level].walls.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}))}
function blocked(x,y){
 if(x<0||y<0||x>=COLS||y>=ROWS)return true;
 return rectsForWalls().some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
}

function makeCoins(){
 const list=[];
 const ghostStarts=[[26,4],[26,15]];
 const currentClusters = levels[level].clusters || [];
 const set = new Set();

 currentClusters.forEach(c => {
   for(let x = c.startX; x <= c.endX; x++){
     for(let y = c.startY; y <= c.endY; y++){
       if(!blocked(x, y) && 
          Math.hypot(x - 1.5, y - 10.5) >= 2.5 && 
          !ghostStarts.some(g => Math.hypot(x - g[0], y - g[1]) < 2.5)){
         const k = key(x, y);
         if(!set.has(k)){
           set.add(k);
           list.push({x, y});
         }
       }
     }
   }
 });

 return list;
}

function reset(){
 player={x:1.5,y:10.5,px:1.5,py:10.5,dir:{x:0,y:0}};
 dir={x:0,y:0};nextDir={x:0,y:0};coins=makeCoins();
 const starts=[[27.5,4.5],[27.5,15.5]];
 ghosts=starts.map((p,i)=>({x:p[0],y:p[1],vx:0,vy:0,change:0,color:i?'#19d3ff':'#ff4152'}));
 started=true; scareShown=false; updateUI();
}

function canMove(px, py, d) {
  if (!d || (d.x === 0 && d.y === 0)) return false;
  const checkRadius = 0.38;
  const targetX = px + d.x * checkRadius;
  const targetY = py + d.y * checkRadius;
  
  return !blocked(Math.floor(targetX), Math.floor(targetY));
}

function movePlayer(dt) {
  const speed = 0.105 * dt;

  if (nextDir.x !== 0 || nextDir.y !== 0) {
    if (nextDir.x !== 0 && canMove(player.x, player.y, nextDir)) {
      player.y = Math.floor(player.y) + 0.5;
      dir = { x: nextDir.x, y: nextDir.y };
    } else if (nextDir.y !== 0 && canMove(player.x, player.y, nextDir)) {
      player.x = Math.floor(player.x) + 0.5;
      dir = { x: nextDir.x, y: nextDir.y };
    }
  }

  if (canMove(player.x, player.y, dir)) {
    player.x += dir.x * speed;
    player.y += dir.y * speed;
  }
}

function chooseGhost(g){
 const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!blocked(Math.floor(g.x+d.x*.7),Math.floor(g.y+d.y*.7)));
 if(!dirs.length)return;
 let d=dirs[Math.floor(Math.random()*dirs.length)];
 if(Math.random()<0.28){
   d=dirs.slice().sort((a,b)=>{
    const da=Math.hypot(g.x+a.x-player.x,g.y+a.y-player.y),db=Math.hypot(g.x+b.x-player.x,g.y+b.y-player.y);return da-db
   })[0];
 }
 g.vx=d.x;g.vy=d.y;g.change=25+Math.random()*55;
}

function update(dt){
 if(!started)return;
 movePlayer(dt);
 
 const initialCoinCount = coins.length;
 coins=coins.filter(c=>Math.hypot(c.x+.5-player.x,c.y+.5-player.y)>.45);
 if (coins.length < initialCoinCount) {
   playCoinSound(); // تشغيل الصوت عند تجميع كوين
 }

 ghosts.forEach(g=>{
   g.change-=dt;if(g.change<=0||blocked(Math.floor(g.x+g.vx*.8),Math.floor(g.y+g.vy*.8)))chooseGhost(g);
   g.x+=g.vx*.075*dt;g.y+=g.vy*.075*dt;
   if(Math.hypot(g.x-player.x,g.y-player.y)<.65) hitGhost();
 });
 if(level===4&&!scareShown&&coins.length<Math.floor(makeCoins().length/2)){
   scareShown=true;triggerScare();
 }
 if(coins.length===0)win();
 updateUI();
}

function hitGhost(){
 if(!started)return;
 playHitSound();
 lives--;started=false;dir={x:0,y:0};nextDir={x:0,y:0};updateUI();
 if(lives<=0){showModal('انتهت المحاولات','ستبدأ المرحلة من جديد.',()=>{lives=3;reset()})}
 else showModal('اصطدمت بشبح!','خسرت محاولة وستُعاد المرحلة.',()=>reset());
}
function win(){
 started=false;
 playWinSound();
 if(level<4){
   unlocked=Math.max(unlocked,level+2);
   showModal('أحسنت! 🎉','جمعت جميع الكوينز. تم فتح المرحلة التالية.',()=>{level++;lives=3;buildStages();reset()});
 }else{
   showModal('فوز! 🏆','أنهيت المراحل الخمس القابلة للعب!',()=>{level=0;lives=3;unlocked=1;buildStages();reset()});
 }
}
function showModal(t,txt,cb){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=txt;document.getElementById('modal').style.display='flex';document.getElementById('modalBtn').onclick=()=>{document.getElementById('modal').style.display='none';cb()}}

// تعديل دالة تشغيل فيديو الرعب لاستخدام كلاس الأنيميشن
function triggerScare(){
 const v=document.getElementById('scareVideo');
 if(!v.querySelector('source').src){showModal('لحظة!','ضع فيديو الرعب الخاص بك في خانة الفيديو داخل الملف ثم أعد تشغيل اللعبة.',()=>{});return}
 
 v.classList.add('active');
 v.currentTime=0;
 v.play().catch(()=>{});
 
 setTimeout(()=>{
   v.pause();
   v.classList.remove('active');
   v.style.display='none';
 },Math.min(7000,(v.duration||7)*1000));
}

function updateUI(){
 document.getElementById('levelText').textContent=(level+1)+' / 6';
 document.getElementById('stageTitle').textContent='المرحلة '+(level+1);
 document.getElementById('difficulty').textContent='مستوى الصعوبة: '+levels[level].difficulty;
 document.getElementById('difficulty').className=level<2?'easy':level<4?'med':'hard';
 document.getElementById('coinText').textContent=(makeCoins().length-coins.length)+' / '+makeCoins().length;
 document.getElementById('lives').textContent=lives;
 document.getElementById('notice').textContent=level===4?'اجمع كل الكوينز للفوز بالمرحلة!':'اجمع كل الكوينز للفوز بالمرحلة!';
}
function buildStages(){
 const box=document.getElementById('stages');box.innerHTML='';
 for(let i=0;i<6;i++){
   const b=document.createElement('button');
   const canEnter=i<5 && i<unlocked;
   b.className='stage '+(i===level?'active':'')+(!canEnter?' locked':'');
   b.innerHTML='<span class="row"><b>المرحلة '+(i+1)+'</b><span class="'+(i<2?'easy':i<4?'med':'hard')+'">'+(i<2?'سهل':i<4?'متوسط':'صعب')+(canEnter?'':' 🔒')+'</span></span>';
   b.onclick=()=>{
     if(canEnter){
       level=i;lives=3;buildStages();reset();
     }
   };
   box.appendChild(b);
 }
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
 
 ctx.strokeStyle='#1d6dff';ctx.lineWidth=3;ctx.shadowColor='#1d6dff';ctx.shadowBlur=8;
 rectsForWalls().forEach(r=>{
   ctx.strokeRect(r.x*CW+1,r.y*CH+1,r.w*CW-2,r.h*CH-2);
 });
 ctx.shadowBlur=0;

 coins.forEach(c=>{ctx.fillStyle='#ffd51c';ctx.beginPath();ctx.arc((c.x+.5)*CW,(c.y+.5)*CH,4.5,0,Math.PI*2);ctx.fill()});
 
 ctx.fillStyle='#ffd51c';ctx.beginPath();
 const a=Math.atan2(dir.y,dir.x)||0, mouth=.34+Math.abs(Math.sin(Date.now()/90))*.12;
 ctx.moveTo(player.x*CW,player.y*CH);ctx.arc(player.x*CW,player.y*CH,Math.min(CW,CH)*.38,a+mouth,a-mouth+Math.PI*2);ctx.closePath();ctx.fill();
 
 ghosts.forEach(g=>{ctx.fillStyle=g.color;const x=g.x*CW,y=g.y*CH,r=Math.min(CW,CH)*.36;
  ctx.beginPath();ctx.arc(x,y-r*.15,r,Math.PI,0);ctx.lineTo(x+r,y+r);ctx.lineTo(x+r*.45,y+r*.65);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y+r);ctx.closePath();ctx.fill();
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-r*.35,y-r*.15,r*.22,0,7);ctx.arc(x+r*.35,y-r*.15,r*.22,0,7);ctx.fill();
  ctx.fillStyle='#14204d';ctx.beginPath();ctx.arc(x-r*.3,y-r*.12,r*.1,0,7);ctx.arc(x+r*.3,y-r*.12,r*.1,0,7);ctx.fill();
 });
}
function loop(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
function setDir(name){
 initAudio();
 nextDir={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];
}
document.addEventListener('keydown',e=>{
 initAudio();
 const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};

});
